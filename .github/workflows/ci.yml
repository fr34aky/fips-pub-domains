name: ci
on:
  push:
  pull_request:
  workflow_call:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --workspace

  portable:
    # docs/platforms.md: the library crates carry no target-specific code.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          # Real cfg attributes only: the rule is stated in comments too.
          if grep -rnE --include='*.rs' '#\[cfg(_attr)?\(.*(target_os|unix|windows)' crates/pubdom-core crates/pubdom-resolve; then
            echo "platform-specific code in a library crate" >&2; exit 1
          fi
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      # ring (via hickory's DNSSEC feature) compiles C for the target: point
      # cc and the linker at the runner's preinstalled NDK, API 24 like fips2go.
      - run: |
          BIN="$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          test -x "$BIN/aarch64-linux-android24-clang" || { echo "NDK clang not found in $BIN" >&2; ls "$BIN" | head; exit 1; }
          export CC_aarch64_linux_android="$BIN/aarch64-linux-android24-clang"
          export AR_aarch64_linux_android="$BIN/llvm-ar"
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER="$BIN/aarch64-linux-android24-clang"
          cargo check -p pubdom-core -p pubdom-resolve --target aarch64-linux-android
