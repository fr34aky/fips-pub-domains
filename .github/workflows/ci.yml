name: ci
on: [push, pull_request]
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --workspace
  portable:
    # docs/platforms.md: the library crates carry no target-specific code.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          if grep -rn 'cfg(target_os\|cfg(unix\|cfg(windows' crates/pubdom-core crates/pubdom-resolve; then
            echo "platform-specific code in a library crate" >&2; exit 1
          fi
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - run: cargo check -p pubdom-core -p pubdom-resolve --target aarch64-linux-android
