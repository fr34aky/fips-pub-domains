[workspace]
resolver = "2"
members = ["crates/pubdom-core", "crates/pubdom-resolve", "crates/pubdom-server", "crates/pubdom-daemon", "crates/pubdom-cli"]

[workspace.package]
edition = "2024"
license = "MIT"
repository = "https://github.com/fr34aky/fips-pub-domains"

[workspace.dependencies]
pubdom-core = { path = "crates/pubdom-core" }
pubdom-resolve = { path = "crates/pubdom-resolve" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
