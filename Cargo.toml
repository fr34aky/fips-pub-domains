[workspace]
resolver = "2"
members = ["crates/names-core"]

[workspace.package]
edition = "2024"
license = "MIT"
repository = "https://github.com/fr34aky/fips-names"

[workspace.dependencies]
names-core = { path = "crates/names-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
