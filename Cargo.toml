[workspace]
resolver = "2"
members = ["crates/pubdom-core", "crates/pubdom-resolve", "crates/pubdom-server", "crates/pubdom-daemon", "crates/pubdom-cli"]

[workspace.package]
# One version for every crate and binary; a release is this number, a
# CHANGELOG entry and an annotated tag vX.Y.Z on main (CONTRIBUTING.md).
version = "0.2.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/fr34aky/fips-pub-domains"

[workspace.dependencies]
pubdom-core = { path = "crates/pubdom-core" }
pubdom-resolve = { path = "crates/pubdom-resolve" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
