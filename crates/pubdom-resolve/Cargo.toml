[package]
name = "pubdom-resolve"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Client I/O for fips-pubdom: relay fetch, legacy TXT verification, step 3 over the mesh"

# Rule (docs/platforms.md): no cfg(target_os) here either. The mesh
# transport is a trait; the phone implements it over smoltcp, the daemon over
# a kernel socket.
[dependencies]
pubdom-core.workspace = true
base64 = "0.22"
rand = "0.8"
futures = "0.3"
hickory-resolver = { version = "0.26", default-features = false, features = ["tokio", "system-config", "dnssec-ring"] }
nostr-sdk = { version = "0.44", default-features = false }
serde.workspace = true
socket2 = "0.6"
serde_yaml = "0.9"
simple-dns = "0.11"
serde_json.workspace = true
thiserror.workspace = true
tokio = { version = "1", features = ["rt", "sync", "time", "net", "macros", "fs"] }
tracing.workspace = true

[dev-dependencies]
tokio = { version = "1", features = ["test-util"] }
